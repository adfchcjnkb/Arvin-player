[package]
name = "parch_dsp"
version = "1.0.0"
edition = "2021"
description = "Parch MP audio processing core"

[lib]
name = "parch_dsp"
crate-type = ["cdylib"]

[dependencies.pyo3]
version = "0.29"
features = ["extension-module"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
